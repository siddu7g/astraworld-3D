name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI help smoke tests
        run: |
          worldforge --help
          worldforge generate --help
          worldforge world --help
          worldforge export --help
          worldforge marble-to-isaac --help
          worldforge credits --help

      - name: Run tests
        run: python -m unittest discover -s tests

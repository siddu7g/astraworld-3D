[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldforge-3d"
version = "0.1.0"
description = "Open-source 3D world generation bridge for Marble, OpenUSD, and Isaac Sim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "usd-core>=24.11",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/siddu7g/worldforge-3D"
Repository = "https://github.com/siddu7g/worldforge-3D"
Issues = "https://github.com/siddu7g/worldforge-3D/issues"

[project.scripts]
worldforge = "apps.api.cli:main"
site-generate = "apps.api.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "."]
include = [
  "site_spec*",
  "asset_registry*",
  "layout*",
  "usd_compose*",
  "isaac_ready*",
  "sim_qa*",
  "look_agent*",
  "semantic_tagger*",
  "apps*",
]

[tool.setuptools.package-data]
asset_registry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
